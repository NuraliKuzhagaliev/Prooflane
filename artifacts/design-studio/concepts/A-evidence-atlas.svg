<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820"><rect width="1500" height="820" fill="#f0f3ef"/><text x="35" y="42" fill="#182b29" font-family="Arial" font-size="23" font-weight="bold">A / EVIDENCE ATLAS</text><text x="35" y="69" fill="#526b66" font-family="Arial" font-size="14" font-weight="normal">Spatial case graph — two static concept frames, synthetic data, no execution claim</text><rect x="30" y="100" width="695" height="650" rx="0" fill="#182b29" stroke="none"/><text x="55" y="133" fill="#ecf5e8" font-family="Arial" font-size="22" font-weight="normal">prooflane / atlas</text><text x="55" y="171" fill="#95bdb0" font-family="Arial" font-size="12" font-weight="normal">ENTRY / CONNECT TWO SOURCES</text><line x1="55" y1="190" x2="700" y2="190" stroke="#4a6860" stroke-width="1"/><text x="570" y="132" fill="#c1d8ce" font-family="Arial" font-size="13" font-weight="normal">Case index</text><rect x="775" y="100" width="695" height="650" rx="0" fill="#182b29" stroke="none"/><text x="800" y="133" fill="#ecf5e8" font-family="Arial" font-size="22" font-weight="normal">prooflane / atlas</text><text x="800" y="171" fill="#95bdb0" font-family="Arial" font-size="12" font-weight="normal">LOADED / FOLLOW A PRICE TO ITS PROOF</text><line x1="800" y1="190" x2="1445" y2="190" stroke="#4a6860" stroke-width="1"/><text x="1315" y="132" fill="#c1d8ce" font-family="Arial" font-size="13" font-weight="normal">Case index</text><rect x="115" y="270" width="210" height="145" rx="0" fill="#233e36" stroke="#88ae8f"/><text x="135" y="302" fill="#bbdabd" font-family="Arial" font-size="14" font-weight="bold">INVOICES</text><text x="135" y="347" fill="#f0f4e8" font-family="Arial" font-size="19" font-weight="normal">Drop source CSV</text><text x="135" y="382" fill="#a5bcae" font-family="Arial" font-size="13" font-weight="normal">Choose file or paste</text><rect x="430" y="270" width="210" height="145" rx="0" fill="#233e36" stroke="#88ae8f"/><text x="450" y="302" fill="#bbdabd" font-family="Arial" font-size="14" font-weight="bold">CONTRACTS</text><text x="450" y="347" fill="#f0f4e8" font-family="Arial" font-size="19" font-weight="normal">Drop price CSV</text><text x="450" y="382" fill="#a5bcae" font-family="Arial" font-size="13" font-weight="normal">Choose file or paste</text><line x1="325" y1="342" x2="430" y2="342" stroke="#88ae8f" stroke-width="2"/><circle cx="377" cy="342" r="6" fill="#c4de96"/><text x="100" y="510" fill="#e6eedd" font-family="Arial" font-size="28" font-weight="normal">A review starts with a relationship.</text><text x="100" y="548" fill="#a5bcae" font-family="Arial" font-size="17" font-weight="normal">Resolve the missing link; preserve every source.</text><text x="100" y="690" fill="#b8c9bc" font-family="Arial" font-size="13" font-weight="normal">The graph never asserts contractual truth.</text><rect x="820" y="265" width="165" height="110" rx="0" fill="#233e36" stroke="#648d7a"/><text x="835" y="295" fill="#bbdabd" font-family="Arial" font-size="13" font-weight="bold">INV501</text><text x="835" y="334" fill="#f0f4e8" font-family="Arial" font-size="20" font-weight="normal">$85 × 40</text><rect x="820" y="485" width="165" height="110" rx="0" fill="#233e36" stroke="#648d7a"/><text x="835" y="515" fill="#bbdabd" font-family="Arial" font-size="13" font-weight="bold">C1 / row 2</text><text x="835" y="554" fill="#f0f4e8" font-family="Arial" font-size="20" font-weight="normal">$72 supplied</text><rect x="1050" y="365" width="180" height="125" rx="0" fill="#233e36" stroke="#648d7a"/><text x="1065" y="395" fill="#bbdabd" font-family="Arial" font-size="13" font-weight="bold">BASELINE</text><text x="1065" y="434" fill="#f0f4e8" font-family="Arial" font-size="20" font-weight="normal">$768.00</text><rect x="1280" y="250" width="145" height="110" rx="0" fill="#233e36" stroke="#648d7a"/><text x="1295" y="280" fill="#bbdabd" font-family="Arial" font-size="13" font-weight="bold">ALTERNATIVE</text><text x="1295" y="319" fill="#f0f4e8" font-family="Arial" font-size="20" font-weight="normal">$368.00</text><rect x="1280" y="520" width="145" height="110" rx="0" fill="#233e36" stroke="#648d7a"/><text x="1295" y="550" fill="#bbdabd" font-family="Arial" font-size="13" font-weight="bold">PACKET</text><text x="1295" y="589" fill="#f0f4e8" font-family="Arial" font-size="20" font-weight="normal">Offline checker</text><line x1="985" y1="320" x2="1050" y2="400" stroke="#b9d98b" stroke-width="2"/><line x1="985" y1="530" x2="1050" y2="450" stroke="#b9d98b" stroke-width="2"/><line x1="1230" y1="400" x2="1280" y2="305" stroke="#b9d98b" stroke-width="2"/><line x1="1230" y1="450" x2="1280" y2="575" stroke="#b9d98b" stroke-width="2"/><text x="815" y="695" fill="#dae8d5" font-family="Arial" font-size="17" font-weight="normal">Select a node → linked facts stay visible.</text><text x="35" y="790" fill="#182b29" font-family="Arial" font-size="15" font-weight="normal">Metaphor: an evidence map. Navigation: focus, trace, return. Main risk: complex graph orientation.</text></svg>