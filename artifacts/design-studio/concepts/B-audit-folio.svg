<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820"><rect width="1500" height="820" fill="#ece9e2"/><text x="35" y="42" fill="#26231f" font-family="Arial" font-size="23" font-weight="bold">B / AUDIT FOLIO</text><text x="35" y="69" fill="#74685b" font-family="Arial" font-size="14" font-weight="normal">Document-first review — two static concept frames, synthetic data, no execution claim</text><rect x="30" y="100" width="695" height="650" rx="0" fill="#fbfaf6" stroke="none"/><text x="54" y="140" fill="#26231f" font-family="Georgia" font-size="30" font-weight="normal">prooflane</text><text x="555" y="134" fill="#26231f" font-family="Arial" font-size="13" font-weight="normal">Archive     New review</text><line x1="54" y1="157" x2="701" y2="157" stroke="#26231f" stroke-width="2"/><text x="54" y="188" fill="#ad3d28" font-family="Arial" font-size="11" font-weight="bold">OPEN A REVIEW</text><text x="54" y="229" fill="#26231f" font-family="Arial" font-size="14" font-weight="normal">01 Sources    02 Ledger    03 Assumptions    04 Proof</text><line x1="54" y1="246" x2="701" y2="246" stroke="#c5bcae" stroke-width="1"/><rect x="775" y="100" width="695" height="650" rx="0" fill="#fbfaf6" stroke="none"/><text x="799" y="140" fill="#26231f" font-family="Georgia" font-size="30" font-weight="normal">prooflane</text><text x="1300" y="134" fill="#26231f" font-family="Arial" font-size="13" font-weight="normal">Archive     New review</text><line x1="799" y1="157" x2="1446" y2="157" stroke="#26231f" stroke-width="2"/><text x="799" y="188" fill="#ad3d28" font-family="Arial" font-size="11" font-weight="bold">NOVEMBER / SUPPLIER REVIEW</text><text x="799" y="229" fill="#26231f" font-family="Arial" font-size="14" font-weight="normal">01 Sources    02 Ledger    03 Assumptions    04 Proof</text><line x1="799" y1="246" x2="1446" y2="246" stroke="#c5bcae" stroke-width="1"/><text x="55" y="300" fill="#26231f" font-family="Georgia" font-size="46" font-weight="nor